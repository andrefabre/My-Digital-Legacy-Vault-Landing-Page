<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#F9FAFB"/>
  
  <!-- Background pattern -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="50" fill="#4F46E5"/>
    <circle cx="700" cy="400" r="80" fill="#10B981"/>
    <circle cx="650" cy="100" r="60" fill="#4F46E5"/>
  </g>
  
  <!-- Main dashboard illustration -->
  <rect x="100" y="80" width="600" height="340" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="100" y="80" width="600" height="60" rx="12" fill="#4F46E5"/>
  <text x="130" y="118" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Digital Legacy Vault</text>
  
  <!-- Navigation dots -->
  <circle cx="660" cy="110" r="6" fill="white" opacity="0.6"/>
  <circle cx="680" cy="110" r="6" fill="white" opacity="0.8"/>
  
  <!-- Sidebar -->
  <rect x="120" y="160" width="140" height="240" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Sidebar items -->
  <rect x="130" y="175" width="120" height="35" rx="6" fill="#4F46E5" opacity="0.2"/>
  <rect x="130" y="220" width="120" height="35" rx="6" fill="#E5E7EB"/>
  <rect x="130" y="265" width="120" height="35" rx="6" fill="#E5E7EB"/>
  <rect x="130" y="310" width="120" height="35" rx="6" fill="#E5E7EB"/>
  
  <!-- Main content area -->
  <rect x="280" y="160" width="400" height="240" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Cards -->
  <rect x="300" y="180" width="170" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="490" y="180" width="170" height="90" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <rect x="300" y="290" width="170" height="90" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <rect x="490" y="290" width="170" height="90" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  
  <!-- Lock icon (security) -->
  <g transform="translate(360, 210)">
    <rect x="15" y="20" width="20" height="25" rx="3" fill="#4F46E5"/>
    <path d="M20 10 C20 5, 30 5, 30 10 L30 20 L20 20 Z" fill="none" stroke="#4F46E5" stroke-width="3"/>
    <circle cx="25" cy="32" r="3" fill="white"/>
  </g>
  
  <!-- Shield icon -->
  <g transform="translate(550, 210)">
    <path d="M25 10 L40 15 L40 30 C40 38, 25 45, 25 45 C25 45, 10 38, 10 30 L10 15 Z" fill="#10B981"/>
    <path d="M25 18 L20 28 L23 28 L28 33 L35 20 L32 20 Z" fill="white"/>
  </g>
  
  <!-- Document icon -->
  <g transform="translate(360, 320)">
    <rect x="15" y="10" width="20" height="30" rx="2" fill="#F59E0B"/>
    <rect x="18" y="15" width="14" height="2" rx="1" fill="white"/>
    <rect x="18" y="20" width="14" height="2" rx="1" fill="white"/>
    <rect x="18" y="25" width="10" height="2" rx="1" fill="white"/>
  </g>
  
  <!-- People icon -->
  <g transform="translate(550, 320)">
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="30" cy="18" r="6" fill="#EF4444"/>
    <path d="M10 35 C10 27, 15 25, 20 25 C25 25, 30 27, 30 35 L10 35 Z" fill="#EF4444"/>
    <path d="M20 35 C20 27, 25 25, 30 25 C35 25, 40 27, 40 35 L20 35 Z" fill="#EF4444"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="400" cy="50" r="20" fill="#10B981" opacity="0.3"/>
  <circle cx="760" cy="250" r="30" fill="#4F46E5" opacity="0.2"/>
</svg>
